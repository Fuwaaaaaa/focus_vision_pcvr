[workspace]
members = ["rust/streaming-engine", "rust/common", "rust/companion-app"]
exclude = ["rust/streaming-engine/fuzz"]
resolver = "2"

[workspace.package]
version = "3.0.0-rc3"
authors = ["Fuwaaaaaa"]
edition = "2021"
license = "MIT OR LicenseRef-Commercial"
repository = "https://github.com/Fuwaaaaaa/focus_vision_pcvr"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[profile.release]
panic = "abort"

# Slim the dev profile's debug info to dodge Windows MSVC LNK1318 (PDB
# unit-count limit hit by the simulator feature's larger object set —
# adds hound + extra bins + tests). Line tables still give usable
# backtraces; the lost detail is per-variable type info which dev
# rarely needs interactively. Production driver linkage (release
# profile) is unaffected.
[profile.dev]
debug = "line-tables-only"
