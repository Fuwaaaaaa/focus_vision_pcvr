# cargo-about configuration for Focus Vision PCVR.
#
# Lists the SPDX licenses we are willing to ship dependencies under. Any
# crate that resolves to a license outside this set fails the
# `cargo about generate` step, which forces a human decision before a new
# dependency sneaks in.
#
# Run:
#   cargo about generate about.hbs > THIRD_PARTY_LICENSES.html
#   cargo about generate about-md.hbs > THIRD_PARTY_LICENSES.md

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",          # Open Font License — bundled fonts in epaint_default_fonts
    "Ubuntu-font-1.0",  # Ubuntu Font License — bundled fonts in epaint_default_fonts
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
]

# Ignore the fuzz workspace — it is a build-time/test-time tool not
# distributed with the engine, so its dependency licenses are not part of
# the shipped artifact's disclosure.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Per-crate license clarifications go here only when needed. cargo-about
# resolves most SPDX expressions automatically; add `[crates."<name>"]`
# overrides for the specific crate names that fail a generate run.
