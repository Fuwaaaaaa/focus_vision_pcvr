[package]
name = "streaming-engine"
version = "3.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Enables the simulator harness: synthetic_capture audio source, headless
# engine binary, mock client binary. Off by default so production driver
# builds don't pull in the extra deps or expose the test surface.
simulator = ["hound"]

[dependencies]
fvp-common = { path = "../common" }
serde.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
bytes = "1"
reed-solomon-erasure = "6"
tokio-util = { version = "0.7", features = ["rt"] }
cpal = "0.15"
audiopus = "0.2"
dirs-next = "2"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hound = { version = "3.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
arbitrary = { version = "1", features = ["derive"] }
rand = "0.8"
tempfile = "3"

[[bench]]
name = "transport"
harness = false

[[bin]]
name = "focus-vision-headless"
path = "bin/headless.rs"
required-features = ["simulator"]

[[bin]]
name = "focus-vision-mock-client"
path = "bin/mock_client.rs"
required-features = ["simulator"]

[build-dependencies]
cbindgen = "0.27"
