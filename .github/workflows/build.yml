name: Build Focus Vision PCVR

on:
    push:
      branches: [main]
      tags: ['v*']
    pull_request:
      branches: [main]
    schedule:
      # Nightly at 03:00 UTC: runs fuzz-nightly. Other jobs still gate on
      # push/PR so this schedule is effectively fuzz-only.
      - cron: '0 3 * * *'

jobs:
    rust-build:
      name: Rust Streaming Engine
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@stable
        - name: Build (production)
          run: cargo build --release -p streaming-engine
        - name: Test (production)
          run: cargo test --release --workspace
        - name: Build (simulator)
          run: cargo build --release -p streaming-engine --features simulator --bins
        - name: Test (simulator)
          # --test-threads=1 because the headless_e2e_test pair shares
          # %APPDATA%/FocusVisionPCVR/status.json — running them in parallel
          # would race the PIN reads/writes.
          run: cargo test --release --workspace --features simulator -- --test-threads=1
        - name: Clippy (production)
          run: cargo clippy --workspace -- -D warnings
        - name: Clippy (simulator)
          run: cargo clippy --workspace --features simulator -- -D warnings
        - name: Security audit
          continue-on-error: true
          run: |
            cargo install cargo-audit --locked 2>/dev/null || true
            cargo audit
        - uses: actions/upload-artifact@v4
          with:
            name: streaming-engine-lib
            path: target/release/streaming_engine.lib
        - uses: actions/upload-artifact@v4
          with:
            name: simulator-binaries
            path: |
              target/release/focus-vision-headless.exe
              target/release/focus-vision-mock-client.exe

    companion-build:
      name: Companion App
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@stable
        - name: Build companion app
          run: cargo build --release -p focus-vision-companion
        - name: Download fonts
          shell: bash
          run: |
            mkdir -p dist/fonts
            # Instrument Serif from Google Fonts API
            curl -sL -o dist/fonts/InstrumentSerif-Regular.ttf \
              "https://github.com/google/fonts/raw/main/ofl/instrumentserif/InstrumentSerif-Regular.ttf" || true
            # Geist from Vercel
            curl -sL -o dist/fonts/Geist-Regular.ttf \
              "https://github.com/vercel/geist-font/raw/main/packages/geist-font/fonts/geist-sans/Geist-Regular.ttf" || true
            curl -sL -o dist/fonts/GeistMono-Regular.ttf \
              "https://github.com/vercel/geist-font/raw/main/packages/geist-mono/fonts/geist-mono/GeistMono-Regular.ttf" || true
            ls -la dist/fonts/
        - name: Package companion app
          shell: bash
          run: |
            mkdir -p dist/config
            cp target/release/focus-vision.exe dist/
            cp config/default.toml dist/config/
            ls -la dist/ dist/fonts/ dist/config/
        - uses: actions/upload-artifact@v4
          with:
            name: companion-app
            path: dist/

    driver-build:
      name: OpenVR Driver DLL
      runs-on: windows-latest
      needs: rust-build
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@stable
        - run: cargo build --release -p streaming-engine
        - run: cmake -B driver/build -S driver -DCMAKE_BUILD_TYPE=Release
        - run: cmake --build driver/build --config Release
        - name: Run C++ tests
          run: ctest --test-dir driver/build --build-config Release --output-on-failure
        - uses: actions/upload-artifact@v4
          with:
            name: openvr-driver
            path: driver/build/focus_vision_pcvr/

    android-build:
      name: Android OpenXR Client
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
        - name: Setup Android SDK
          uses: android-actions/setup-android@v3
        - name: Install NDK and CMake
          run: |
            sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
        - uses: gradle/actions/setup-gradle@v4
          with:
            gradle-version: '8.5'
        - name: Build APK
          working-directory: client
          run: gradle assembleDebug -Pandroid.ndkVersion=26.1.10909125
        - uses: actions/upload-artifact@v4
          with:
            name: android-client
            path: client/app/build/outputs/apk/debug/*.apk

    version-lint:
      name: Version Consistency
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        - name: Check all version sources agree
          shell: pwsh
          run: ./scripts/check-versions.ps1

    fuzz-nightly:
      name: Fuzz (nightly)
      # Skip on PRs to keep PR latency low; runs on every push to main
      # plus the cron schedule. Cron is wired at the workflow level so this
      # block stays close to the targets it owns.
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      continue-on-error: true
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@nightly
        - name: Install cargo-fuzz
          run: cargo install cargo-fuzz --locked
        - name: Smoke-fuzz each target (30 s budget)
          working-directory: rust/streaming-engine
          run: |
            for target in fuzz_rtp fuzz_fec fuzz_protocol fuzz_config fuzz_slice fuzz_recording; do
              echo "=== $target ==="
              cargo +nightly fuzz run "$target" -- -max_total_time=30 -print_final_stats=1
            done
        - name: Upload fuzz artifacts on failure
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: fuzz-artifacts
            path: rust/streaming-engine/fuzz/artifacts/

    release:
      name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      needs: [companion-build, driver-build, android-build]
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4
        - uses: actions/download-artifact@v4
          with:
            path: artifacts/
        - name: Package release archives
          run: |
            cd artifacts
            # Companion app zip
            cd companion-app && zip -r ../../FocusVision-Companion-${{ github.ref_name }}.zip . && cd ..
            # Driver zip
            cd openvr-driver && zip -r ../../FocusVision-Driver-${{ github.ref_name }}.zip . && cd ..
            # APK (copy as-is)
            cp android-client/*.apk ../FocusVision-Client-${{ github.ref_name }}.apk 2>/dev/null || true
            cd ..
        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            generate_release_notes: true
            files: |
              FocusVision-Companion-*.zip
              FocusVision-Driver-*.zip
              FocusVision-Client-*.apk
