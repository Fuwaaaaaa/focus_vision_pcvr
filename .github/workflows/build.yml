name: Build Focus Vision PCVR

on:
    push:
      branches: [main]
      tags: ['v*']
    pull_request:
      branches: [main]
      # Default activity types are opened/synchronize/reopened. Adding
      # ready_for_review means a draft PR transitioned to ready also
      # triggers a build — otherwise the PR sits without any CI signal
      # until the next push, which is easy to miss.
      types: [opened, synchronize, reopened, ready_for_review]
    # Manual trigger for one-off rebuilds (e.g. after a transient
    # CI infra issue or a flaky third-party action). Falls back to the
    # currently-checked-out ref of the workflow file.
    workflow_dispatch:
    schedule:
      # Nightly at 03:00 UTC: runs fuzz-nightly. Other jobs still gate on
      # push/PR so this schedule is effectively fuzz-only.
      - cron: '0 3 * * *'

jobs:
    rust-build:
      name: Rust Streaming Engine
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@stable
        - name: Build (production)
          run: cargo build --release -p streaming-engine
        - name: Test (production)
          run: cargo test --release --workspace
        - name: Build (simulator)
          run: cargo build --release -p streaming-engine --features simulator --bins
        - name: Test (simulator)
          # --test-threads=1 because the headless_e2e_test pair shares
          # %APPDATA%/FocusVisionPCVR/status.json — running them in parallel
          # would race the PIN reads/writes.
          run: cargo test --release --workspace --features simulator -- --test-threads=1
        - name: Clippy (production)
          run: cargo clippy --workspace -- -D warnings
        - name: Clippy (simulator)
          run: cargo clippy --workspace --features simulator -- -D warnings
        - name: Security audit
          continue-on-error: true
          run: |
            cargo install cargo-audit --locked 2>/dev/null || true
            cargo audit
        - uses: actions/upload-artifact@v4
          with:
            name: streaming-engine-lib
            path: target/release/streaming_engine.lib
        - uses: actions/upload-artifact@v4
          with:
            name: simulator-binaries
            path: |
              target/release/focus-vision-headless.exe
              target/release/focus-vision-mock-client.exe

    companion-build:
      name: Companion App
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@stable
        - name: Build companion app
          run: cargo build --release -p focus-vision-companion
        - name: Download fonts
          shell: bash
          run: |
            mkdir -p dist/fonts
            # Instrument Serif from Google Fonts API
            curl -sL -o dist/fonts/InstrumentSerif-Regular.ttf \
              "https://github.com/google/fonts/raw/main/ofl/instrumentserif/InstrumentSerif-Regular.ttf" || true
            # Geist from Vercel
            curl -sL -o dist/fonts/Geist-Regular.ttf \
              "https://github.com/vercel/geist-font/raw/main/packages/geist-font/fonts/geist-sans/Geist-Regular.ttf" || true
            curl -sL -o dist/fonts/GeistMono-Regular.ttf \
              "https://github.com/vercel/geist-font/raw/main/packages/geist-mono/fonts/geist-mono/GeistMono-Regular.ttf" || true
            ls -la dist/fonts/
        - name: Sign focus-vision.exe (Authenticode)
          # Skipped when secrets are not configured (PR builds, forks).
          # When a maintainer adds WINDOWS_PFX_BASE64 + WINDOWS_PFX_PASSWORD
          # to repo secrets, this signs the exe in-place before packaging
          # so the user's first launch doesn't trip Windows SmartScreen.
          # NOTE: GH Actions rejects `secrets.*` in `if:` expressions, so
          # we hoist the secret into `env` and gate on the env var instead.
          env:
            WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
            WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          if: env.WINDOWS_PFX_BASE64 != ''
          shell: pwsh
          run: ./scripts/sign-windows.ps1 -FilePath target/release/focus-vision.exe
        - name: Package companion app
          shell: bash
          run: |
            mkdir -p dist/config
            cp target/release/focus-vision.exe dist/
            cp config/default.toml dist/config/
            ls -la dist/ dist/fonts/ dist/config/
        - uses: actions/upload-artifact@v4
          with:
            name: companion-app
            path: dist/

    driver-build:
      name: OpenVR Driver DLL
      runs-on: windows-latest
      needs: rust-build
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@stable
        - run: cargo build --release -p streaming-engine
        - run: cmake -B driver/build -S driver -DCMAKE_BUILD_TYPE=Release
        - run: cmake --build driver/build --config Release
        - name: Run C++ tests
          run: ctest --test-dir driver/build --build-config Release --output-on-failure
        - uses: actions/upload-artifact@v4
          with:
            name: openvr-driver
            path: driver/build/focus_vision_pcvr/

    android-build:
      name: Android OpenXR Client
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
        - name: Setup Android SDK
          uses: android-actions/setup-android@v3
        - name: Install NDK and CMake
          run: |
            sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
        - uses: gradle/actions/setup-gradle@v4
          with:
            gradle-version: '8.5'
        - name: Stage release keystore
          # Two paths:
          #   1. ANDROID_KEYSTORE_BASE64 secret present → decode to a temp
          #      file, point build.gradle.kts at it via ANDROID_KEYSTORE_PATH.
          #      Produces a Play-Store-publishable APK.
          #   2. Secret absent → generate an ephemeral keystore with keytool
          #      so assembleRelease still runs (sideload-only APK; Play
          #      Store rejection only matters when we actually publish there).
          shell: bash
          env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          run: |
            set -euo pipefail
            KS_PATH="$RUNNER_TEMP/release.keystore"
            if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo "Real release keystore secret present — decoding"
              echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
              echo "ANDROID_KEYSTORE_PATH=$KS_PATH"     >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-}" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-focus_vision_pcvr}" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-}}" >> "$GITHUB_ENV"
            else
              echo "No release keystore secret — generating ephemeral keystore"
              # Generated keystore is per-build; the APK signed with it is
              # sideloadable but not Play-Store-publishable (Play requires
              # the same upload key every time).
              EPHEMERAL_PASS="ephemeral$(date +%s)"
              keytool -genkeypair -v \
                -keystore "$KS_PATH" \
                -storetype PKCS12 \
                -storepass "$EPHEMERAL_PASS" \
                -keypass "$EPHEMERAL_PASS" \
                -alias focus_vision_pcvr \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Focus Vision PCVR CI, O=Fuwaaaaaa, C=JP"
              echo "ANDROID_KEYSTORE_PATH=$KS_PATH"           >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_ALIAS=focus_vision_pcvr"      >> "$GITHUB_ENV"
              echo "ANDROID_KEY_PASSWORD=$EPHEMERAL_PASS"     >> "$GITHUB_ENV"
            fi
        - name: Build release APK
          working-directory: client
          run: gradle assembleRelease -Pandroid.ndkVersion=26.1.10909125
        - name: Verify APK signature
          shell: bash
          run: |
            APK=$(ls client/app/build/outputs/apk/release/*.apk | head -1)
            echo "Built: $APK"
            # apksigner verify confirms the signing block is well-formed.
            # If it ever fails the build is broken — signed-debug fallback
            # would also fail here (the apksigner from build-tools is
            # used; signtool isn't applicable here).
            APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --verbose "$APK"
        - uses: actions/upload-artifact@v4
          with:
            name: android-client
            path: client/app/build/outputs/apk/release/*.apk

    version-lint:
      name: Version Consistency
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        - name: Check all version sources agree
          shell: pwsh
          run: ./scripts/check-versions.ps1

    fuzz-nightly:
      name: Fuzz (nightly)
      # Skip on PRs to keep PR latency low; runs on every push to main
      # plus the cron schedule. Cron is wired at the workflow level so this
      # block stays close to the targets it owns.
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      continue-on-error: true
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@nightly
        - name: Install cargo-fuzz
          run: cargo install cargo-fuzz --locked
        - name: Smoke-fuzz each target (30 s budget)
          working-directory: rust/streaming-engine
          run: |
            for target in fuzz_rtp fuzz_fec fuzz_protocol fuzz_config fuzz_slice fuzz_recording; do
              echo "=== $target ==="
              cargo +nightly fuzz run "$target" -- -max_total_time=30 -print_final_stats=1
            done
        - name: Upload fuzz artifacts on failure
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: fuzz-artifacts
            path: rust/streaming-engine/fuzz/artifacts/

    coverage:
      name: Coverage (nightly)
      # Coverage instrumentation roughly doubles compile time and the LLVM
      # profile collection isn't free either — skip on PRs to keep CI fast,
      # run on push to main and the nightly cron so we still catch regression.
      if: github.event_name != 'pull_request'
      runs-on: windows-latest
      continue-on-error: true
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
        - uses: dtolnay/rust-toolchain@stable
          with:
            components: llvm-tools-preview
        - name: Install cargo-llvm-cov
          uses: taiki-e/install-action@cargo-llvm-cov
        - name: Generate coverage (workspace + simulator)
          # --test-threads=1 mirrors the rust-build job: the headless_e2e_test
          # pair shares status.json. Cobertura output for downstream tooling,
          # plus a human-readable summary line for the action log.
          run: |
            cargo llvm-cov --workspace --features simulator --cobertura --output-path coverage.xml -- --test-threads=1
            cargo llvm-cov report --features simulator --summary-only
        - name: Upload coverage XML
          uses: actions/upload-artifact@v4
          with:
            name: coverage-cobertura
            path: coverage.xml

    installer-build:
      name: Windows Installer (NSIS)
      runs-on: windows-latest
      needs: [companion-build, driver-build]
      steps:
        - uses: actions/checkout@v4
        - uses: actions/download-artifact@v4
          with:
            name: companion-app
            path: dist/
        - uses: actions/download-artifact@v4
          with:
            name: openvr-driver
            path: driver/build/focus_vision_pcvr/
        - name: Stage companion exe at NSIS-expected path
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force -Path target/release | Out-Null
            Copy-Item dist/focus-vision.exe target/release/focus-vision.exe
        - name: Verify makensis available
          shell: pwsh
          run: |
            # windows-latest ships NSIS, but the binary lives under
            # C:\Program Files (x86)\NSIS\ and isn't always on PATH.
            $nsis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
            if (-not $nsis) {
              $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
              if (-not (Test-Path $nsis)) {
                choco install nsis --no-progress -y
                $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
              }
              Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
            }
            Write-Host "makensis: $nsis"
            & $nsis /VERSION
        - name: Build NSIS installer
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force -Path out | Out-Null
            makensis installer/focus_vision.nsi
            Get-ChildItem out/
        - name: Sign installer .exe (Authenticode)
          # Same conditional + script as companion-build above. Signing
          # the installer (in addition to the inner exe) is what builds
          # SmartScreen reputation as downloads accumulate. Env-hoist
          # workaround for the same `secrets.*` in `if:` restriction.
          env:
            WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
            WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          if: env.WINDOWS_PFX_BASE64 != ''
          shell: pwsh
          run: |
            $exe = Get-ChildItem out/FocusVision-*-Setup.exe | Select-Object -First 1
            ./scripts/sign-windows.ps1 -FilePath $exe.FullName
        - name: Smoke-verify the installer
          shell: pwsh
          run: |
            $exe = Get-ChildItem out/FocusVision-*-Setup.exe | Select-Object -First 1
            if (-not $exe) { throw "installer not produced" }
            Write-Host "Built: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
            # Authenticode signature status — informational. "Valid" after
            # D2 secrets are configured, "NotSigned" otherwise.
            Get-AuthenticodeSignature $exe.FullName | Format-List Status,StatusMessage
        - uses: actions/upload-artifact@v4
          with:
            name: windows-installer
            path: out/FocusVision-*-Setup.exe

    release:
      name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      needs: [companion-build, driver-build, android-build, installer-build]
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4
        - uses: actions/download-artifact@v4
          with:
            path: artifacts/
        - name: Package release archives
          run: |
            cd artifacts
            # Companion app zip (legacy distribution — installer is preferred)
            cd companion-app && zip -r ../../FocusVision-Companion-${{ github.ref_name }}.zip . && cd ..
            # Driver zip (devs / manual installs)
            cd openvr-driver && zip -r ../../FocusVision-Driver-${{ github.ref_name }}.zip . && cd ..
            # APK (sideload)
            cp android-client/*.apk ../FocusVision-Client-${{ github.ref_name }}.apk 2>/dev/null || true
            # NSIS installer (preferred distribution)
            cp windows-installer/FocusVision-*-Setup.exe ../ 2>/dev/null || true
            cd ..
            ls -la FocusVision-*
        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            generate_release_notes: true
            files: |
              FocusVision-*-Setup.exe
              FocusVision-Companion-*.zip
              FocusVision-Driver-*.zip
              FocusVision-Client-*.apk
